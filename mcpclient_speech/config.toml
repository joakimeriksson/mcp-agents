[llm]
model    = "gemma4:latest"
base_url = "http://localhost:11434/v1/"
api_key  = "ollama"
direct_audio = true    # speech straight into gemma4 (one call: hear + think + tools)

[face]
omit_names_and_prefs = false

[devices]
# camera     = 0   # uncomment to set default camera index (face client only)
# microphone = 0   # uncomment to set default microphone device index

[debug]
audio_panel = true   # VU meters + oscilloscope in the eye window
